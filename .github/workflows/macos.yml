name: macOS native build and tests
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-beta.*'
    paths:
      - 'macos/**'
      - 'tools/*macos*'
      - 'src/animation/**'
      - 'src/theme/**'
      - 'src/runtime/**'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build universal native app
        run: bash tools/build-macos.sh
      - name: Test AppKit, WebKit, audio metadata and resource safety
        run: bash macos/tests/native.sh
      - name: Package DMG and ZIP
        run: bash tools/package-macos.sh
      - name: Mount and verify DMG
        run: |
          mount="$RUNNER_TEMP/rise-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/macos/*.dmg
          codesign --verify --deep --strict "$mount/Rise On Air.app"
          test -L "$mount/Applications"
          hdiutil detach "$mount"
      - name: Upload packages and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rise-${{ matrix.os }}
          path: |
            dist/macos/*
            build/macos-test-*/
          if-no-files-found: warn
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rise-macos-15
          path: release-files
      - name: Publish tested macOS Beta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(tr -d '[:space:]' < macos/VERSION)"
          gh release create "$TAG" \
            release-files/dist/macos/*.dmg \
            release-files/dist/macos/*.zip \
            release-files/dist/macos/SHA256SUMS-macos.txt \
            --prerelease --verify-tag \
            --title "Rise On Air $TAG · macOS 启动与主题恢复修复" \
            --notes-file docs/MACOS-RELEASE.md
