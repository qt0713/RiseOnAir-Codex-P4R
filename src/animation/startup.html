<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rise On Air</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#242124;color:#fff9ec;font:14px system-ui,'Microsoft YaHei',sans-serif}iframe{position:absolute;top:48px;left:0;width:100%;height:calc(100% - 48px);border:0}.bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:6px;padding:2px 10px;background:#242124}.drag{align-self:stretch;flex:1;min-width:0;display:flex;align-items:center;cursor:move;user-select:none;font-size:12px;letter-spacing:.05em;color:#fff9ecb3}.drag span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}button{border:0;border-radius:6px;background:#ffffff12;color:#fff9ec;padding:8px 12px;min-height:40px;min-width:44px;font:inherit;cursor:pointer;white-space:nowrap}button:focus-visible{outline:2px solid #ffd83d;outline-offset:1px}#resize{position:absolute;right:0;bottom:0;width:26px;height:26px;min-width:0;min-height:0;padding:0;background:#24212490;cursor:nwse-resize;font-size:18px;border-radius:6px 0 0}#wait{display:none;position:absolute;inset:48px 0 0;background:#2421244d;align-items:flex-end;justify-content:center;padding:clamp(12px,4vw,28px)}#wait>div{padding:15px 20px;background:#242124f2;border-radius:12px;text-align:center;max-width:100%;overflow-wrap:anywhere}#retry,#close{display:none;background:#ffd83d;color:#242124;margin:10px 4px 0}@media(max-width:420px){.bar{padding:2px 6px;gap:4px}button{font-size:12px;padding:8px}.drag{font-size:11px}}@media(max-height:280px){.bar{height:44px}iframe{top:44px;height:calc(100% - 44px)}#wait{inset:44px 0 0}}
</style></head><body><iframe id="scene" src="index.html?responsive=1" title="理世展示版启动动画"></iframe><div class="bar"><div id="drag" class="drag" title="拖动窗口"><span>RISE ON AIR</span></div><button id="mute">静音</button><button id="skip">跳过 Esc</button></div><button id="resize" aria-label="拖动调整窗口大小" title="拖动调整窗口大小">◢</button><div id="wait"><div><span id="status">正在打开 Codex…</span><div><button id="retry">重试</button><button id="close">关闭</button></div></div></div><script>
const frame=document.getElementById('scene'),post=message=>window.chrome?.webview?.postMessage(message);
let audio,api,start=0,running=false,muted=new URLSearchParams(location.search).has('muted'),voiceStarted=false,captured=false,raf=0;
const mute=document.getElementById('mute');function updateMute(){mute.textContent=muted?'开启语音':'静音';mute.setAttribute('aria-pressed',String(muted));if(audio)audio.muted=muted}updateMute();
mute.onclick=()=>{muted=!muted;updateMute();post('muted='+muted)};
function stop(){running=false;cancelAnimationFrame(raf);audio?.pause()}
document.getElementById('skip').onclick=()=>{stop();post('skip')};document.getElementById('retry').onclick=()=>post('retry');document.getElementById('close').onclick=()=>post('close');
document.getElementById('drag').onpointerdown=e=>{if(e.button===0)post('drag')};document.getElementById('resize').onpointerdown=e=>{if(e.button===0)post('resize')};
function onKey(e){if(e.key==='Escape'){stop();post('skip')}if(e.key.toLowerCase()==='m')mute.click()}document.addEventListener('keydown',onKey);
frame.onload=async()=>{try{const doc=frame.contentDocument;await doc.fonts.ready;await Promise.all([...doc.images].map(im=>im.decode()));api=frame.contentWindow.rise;audio=doc.getElementById('rise-greeting');audio.volume=.8;updateMute();doc.addEventListener('keydown',onKey);post('metadata duration='+api.duration.toFixed(3)+' renderer=responsive-html');start=performance.now();running=true;post('playing muted='+muted);raf=requestAnimationFrame(tick)}catch(e){post('error initialize='+e.message)}};
function tick(now){if(!running)return;const t=Math.min(api.duration,(now-start)/1000);api.seek(t);if(!voiceStarted&&t>=.68){voiceStarted=true;audio.currentTime=Math.max(0,t-.68);audio.play().then(()=>post('voice-playing')).catch(e=>post('voice-unavailable '+e.name))}if(!captured&&t>=1.4){captured=true;post('capture')}if(t>=api.duration){stop();post('ended');return}raf=requestAnimationFrame(tick)}
window.showWaiting=failed=>{stop();api?.seek(2.35);document.getElementById('wait').style.display='flex';document.getElementById('status').textContent=failed?'应用暂未就绪，请重试或直接打开。':'正在打开 Codex…';document.getElementById('retry').style.display=failed?'inline-block':'none';document.getElementById('close').style.display=failed?'inline-block':'none'};
</script></body></html>
